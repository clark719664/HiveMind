<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#110b22"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f0ff"/>
    </marker>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bgFlow)" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    LARGE-SCALE PARALLEL DEVELOPMENT • PROTECTED MAIN • IMMUTABLE RELEASE PIPELINE
  </text>

  <!-- Step 1: 5 Parallel Tracks -->
  <g transform="translate(30, 55)">
    <rect width="250" height="195" rx="10" fill="#0b1528" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="125" y="24" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#00f0ff" text-anchor="middle">1. 5 PARALLEL TOPIC TRACKS</text>
    <text x="15" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• feat/m1-* (QUIC/Kademlia)</text>
    <text x="15" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• feat/m2-* (3-Tier Pinned DMA)</text>
    <text x="15" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• feat/m3-* (Triton FP8 / Tree)</text>
    <text x="15" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• feat/m4-* (OpenAI SSE / OPoI)</text>
    <text x="15" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#10b981">• expert/* &amp; game/* (HF Missions)</text>
    <text x="15" y="174" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">Zero Cross-Module Lock Contention</text>
  </g>

  <!-- Step 2: Automated CI & Lean 4 Gate -->
  <g transform="translate(325, 55)">
    <rect width="265" height="195" rx="10" fill="#0b1528" stroke="#10b981" stroke-width="1.5"/>
    <text x="132" y="24" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">2. AUTOMATED PR CI GATES</text>
    <text x="15" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• 20/20 Pytest Suite (pytest -v)</text>
    <text x="15" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#00f0ff">• Lean 4 Proof Check (0 sorry)</text>
    <text x="15" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• 8GB VRAM Budget (&lt;= 6.5 GB)</text>
    <text x="15" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• CUDA Spot-Check (ε &lt;= 1e-4)</text>
    <text x="15" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#f59e0b">• AutoevolveAI Paper Audit (&gt;=9.0)</text>
    <text x="15" y="174" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">CODEOWNERS Track Review</text>
  </g>

  <!-- Step 3: Protected Main Branch -->
  <g transform="translate(635, 55)">
    <rect width="250" height="195" rx="10" fill="#0b1528" stroke="#a855f7" stroke-width="1.5"/>
    <text x="125" y="24" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">3. PROTECTED MAIN BRANCH</text>
    <text x="15" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Force-Pushes Blocked (✗)</text>
    <text x="15" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Branch Deletion Blocked (✗)</text>
    <text x="15" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#10b981">• Required CI Status Checks (✓)</text>
    <text x="15" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#00f0ff">• Conversation Resolution (✓)</text>
    <text x="15" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Linear / Merge History Tracked</text>
    <text x="15" y="174" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">PoUW Contributor Credit Logged</text>
  </g>

  <!-- Step 4: Immutable Release & Checksums -->
  <g transform="translate(930, 55)">
    <rect width="240" height="195" rx="10" fill="#0b1528" stroke="#ff00a0" stroke-width="1.5"/>
    <text x="120" y="24" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ff00a0" text-anchor="middle">4. IMMUTABLE RELEASE (v*)</text>
    <text x="15" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Protected Tags (refs/tags/v*)</text>
    <text x="15" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#10b981">• SHA256SUMS.txt Attestation</text>
    <text x="15" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#00f0ff">• RTX GPU Cert HMAC Embedded</text>
    <text x="15" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Foundation PDF + Lean 4 Spec</text>
    <text x="15" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#f59e0b">• Steam Edition Zip Bundle</text>
    <text x="15" y="174" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">Zero Tag Mutation / Deletion</text>
  </g>

  <!-- Arrows -->
  <line x1="280" y1="152" x2="320" y2="152" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="590" y1="152" x2="630" y2="152" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="885" y1="152" x2="925" y2="152" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
