name: HiveMind Swarm CI & Verification Suite

on:
  push:
    branches: [main, "feat/**", "expert/**", "game/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-swarm-suite:
    name: "Verify 4 Core Pillars, Swarm Fabric (M1-M5), Lean 4 Spec & Steam Hack-Miner"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: "src:."
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      PYTHONHASHSEED: "42"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Checkout Project HiveMind
        uses: actions/checkout@v7

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies (CPU CI Fallback + FastAPI/PyTorch/Transformers/PEFT)
        run: |
          uv venv
          uv pip install --no-sources --torch-backend cpu -e ".[dev]" datasets huggingface-hub \
            "torch==2.6.0" "transformers==4.57.6" "peft==0.17.1" "numpy==2.1.3"
          uv pip check
          uv run --no-sync python -c "import aioquic, cryptography, websockets"

      - name: Compile Lean specification with pinned lean4/lean-toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean4
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"

      - name: Require compiler-checked proofs and complete axiom audit
        run: |
          uv run --no-sync python - <<'PY'
          from paper.autoevolve_peer_review_pipeline import require_machine_checked, verify_lean4_specification
          result = verify_lean4_specification()
          print("Lean audit:", result)
          require_machine_checked(result)
          assert result["theorem_count"] >= 32, "Expected at least 32 theorems"
          PY

      - name: Run Full Verification Suite
        run: |
          uv run --no-sync python -m pytest tests/ -v --tb=short

      - name: Verify CLI Entrypoints & Hardware Telemetry
        run: |
          uv run --no-sync python -m hivemind.cli.main --help
          uv run --no-sync python -m hivemind.cli.main hardware-check
